[workspace]
resolver = "2"
members = [
    "crates/gatepup-config",
    "crates/gatepup-core",
    "crates/gatepup-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/denyzhirkov/gatepup"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

gatepup-config = { path = "crates/gatepup-config" }
gatepup-core = { path = "crates/gatepup-core" }
