[workspace]
resolver = "2"
members = [
    "crates/gatepup-config",
    "crates/gatepup-core",
    "crates/gatepup-proxy",
    "crates/gatepup-observability",
    "crates/gatepup-admin",
    "crates/gatepup-cli",
    "crates/gatepup-bench",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/denyzhirkov/gatepup"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
ipnet = "2"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "server-graceful", "http1", "tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
prometheus = { version = "0.13", default-features = false }
arc-swap = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = "0.13"

gatepup-config = { path = "crates/gatepup-config" }
gatepup-core = { path = "crates/gatepup-core" }
gatepup-proxy = { path = "crates/gatepup-proxy" }
gatepup-observability = { path = "crates/gatepup-observability" }
gatepup-admin = { path = "crates/gatepup-admin" }
