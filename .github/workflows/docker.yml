name: docker

# Build and publish the Docker image to Docker Hub.
#   push to main      -> denyzhirkov/gatepup:edge
#   push tag vX.Y.Z   -> denyzhirkov/gatepup:X.Y.Z  + :latest
#
# Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (Settings -> Secrets and variables -> Actions). The image push is skipped
# until DOCKERHUB_TOKEN is set, so the pipeline stays green before secrets exist.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  IMAGE: denyzhirkov/gatepup

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Push only when the Docker Hub token is configured; otherwise build-only
      # (lets the workflow pass before the secret is added).
      - name: Resolve push intent
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: echo "push=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      # QEMU enables the cross-platform (arm64) build under emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
          flavor: |
            latest=auto

      - name: Log in to Docker Hub
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
